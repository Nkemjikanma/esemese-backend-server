[package]
name = "esemese-backend-server"
version = "0.1.0"
authors = ["Nkemjika Ohanyere <contact@nkem.dev>"]
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "esemese-backend-server"

[dependencies]
actix-cors = "0.7.1"
actix-governor = "0.10.0"
actix-web = "4.14.0"
actix-web-httpauth = "0.8.2"
argon2 = "0.5.3"
aws-config = { version = "1.8.18", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.137.0"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
jsonwebtoken = {version = "10.4.0", features = ["rust_crypto"] }
secrecy = {version = "0.10.3", features = ["serde"]}
serde = "1.0.228"
serde-aux = "4.7.0"
serde_json = "1.0.150"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "tls-rustls-ring-webpki", "chrono", "uuid", "ipnetwork"] }
thiserror = "2.0.18"
tokio = {version = "1.52.3", features = ["full", "macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-actix-web = "0.7.22"
tracing-bunyan-formatter = "0.3.10"
tracing-log = "0.2.0"
tracing-subscriber = {version = "0.3.23", features = ["registry", "env-filter"] }
unicode-segmentation = "1.13.3"
uuid = {version = "1.23.4", features = ["serde", "v4"] }
rayon = "1.12.0"
image = "0.25.10"
blurhash = "0.2.3"
sha2 = "0.11.0"
kamadak-exif = "0.6.1"